name: ${DCPREFIX:-}dockerclaude
services:
  dockerclaude:
    environment:
      - TERM
      - TERM_PROGRAM
      - TERM_PROGRAM_VERSION
      - COLORTERM
      - TMUX
      - TZ=Europe/Stockholm
    image: ${DCIMAGEPREFIX:-}dockerclaude:${DCIMAGETAG:-latest}
    container_name: ${DCPREFIX:-}dockerclaude
    read_only: false
    restart: unless-stopped
    security_opt: [no-new-privileges]
    volumes:
      - type: bind
        source: ./${DCPREFIX:-}dot-claude
        target: /workspace/.claude
      - type: bind
        source: ./${DCPREFIX:-}mounts
        target: /mnt
        bind:
          propagation: rslave
